name: cleanapp
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  get_it: ^7.6.4

  # Networking
  dio: ^5.4.0
  pretty_dio_logger: ^1.3.1

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # Push Notifications (Firebase Cloud Messaging)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3

  # UI & Utilities
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  google_fonts: ^6.1.0
  intl: ^0.20.2
  path_provider: ^2.1.1
  flutter_map: ^8.3.0
  latlong2: ^0.9.1
  geolocator: ^13.0.2
  image_picker: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/icons/
    - assets/images/
    - assets/images/car.JPG
    - assets/images/fast.JPG
    - assets/images/matla.JPG
    - assets/images/sejadaclean.JPG
    - assets/images/fix1.png
    - assets/images/fix2.png
    - assets/images/fix3.png
    - assets/images/logo.png
    - assets/images/svg/
    - assets/animation/
  fonts:
    - family: Gilmer
      fonts:
        - asset: assets/fonts/Gilmer-Regular.ttf
          weight: 300
        - asset: assets/fonts/Gilmer-Medium.ttf
          weight: 500
        - asset: assets/fonts/Gilmer-Bold.ttf
          weight: 700
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter_28pt-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter_24pt-Black.ttf
          weight: 900
